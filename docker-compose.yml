services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - STATIC_ROOT=/app/staticfiles
      - DATABASE_PATH=/app/data/db.sqlite3
    volumes:
      - ${DB_DIR:-.}/db.sqlite3:/app/data/db.sqlite3
      - logs:/app/logs
      - static_files:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn tallinnstartups.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    restart: unless-stopped

volumes:
  logs:
  static_files:
