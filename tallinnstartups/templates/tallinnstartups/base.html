{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Sora%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
    <title>{% block title %}CareerConnect{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        .featured-star-inline {
            color: #f76969 !important;
        }
        .featured-star-inline::before {
            content: "☆";
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="relative flex size-full min-h-screen flex-col bg-slate-50 group/design-root overflow-x-hidden" style='font-family: Sora, "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            {% include 'tallinnstartups/components/header.html' %}
            
            <main>
                {% block content %}{% endblock %}
            </main>
            
            {% include 'tallinnstartups/components/footer.html' %}
        </div>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
