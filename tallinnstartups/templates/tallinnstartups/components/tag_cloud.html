<div class="tag-cloud">
    {% for tag in tags %}
        <div class="theme-category-badge">
            <p class="theme-primary-text">
                {% if tag.url %}
                    <a href="{{ tag.url }}">
                        {{ tag.name }} ({{ tag.count }})
                    </a>
                {% else %}
                    {{ tag.name }} ({{ tag.count }})
                {% endif %}
            </p>
        </div>
    {% empty %}
        <div class="theme-category-badge">
            <p class="theme-primary-text">Engineering (120)</p>
        </div>
        <div class="theme-category-badge">
            <p class="theme-primary-text">Marketing (85)</p>
        </div>
        <div class="theme-category-badge">
            <p class="theme-primary-text">Sales (110)</p>
        </div>
        <div class="theme-category-badge">
            <p class="theme-primary-text">Product (90)</p>
        </div>
        <div class="theme-category-badge">
            <p class="theme-primary-text">Design (75)</p>
        </div>
        <div class="theme-category-badge">
            <p class="theme-primary-text">Operations (60)</p>
        </div>
    {% endfor %}
</div>
