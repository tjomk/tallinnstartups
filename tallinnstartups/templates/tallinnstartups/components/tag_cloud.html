<div class="flex gap-3 px-4 py-3 flex-wrap">
    {% for tag in tags %}
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">
                {% if tag.url %}
                    <a href="{{ tag.url }}" class="hover:underline">
                        {{ tag.name }} ({{ tag.count }})
                    </a>
                {% else %}
                    {{ tag.name }} ({{ tag.count }})
                {% endif %}
            </p>
        </div>
    {% empty %}
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Engineering (120)</p>
        </div>
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Marketing (85)</p>
        </div>
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Sales (110)</p>
        </div>
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Product (90)</p>
        </div>
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Design (75)</p>
        </div>
        <div class="theme-category-badge flex h-8 shrink-0 items-center justify-center gap-x-2">
            <p class="theme-primary-text text-sm font-medium leading-normal">Operations (60)</p>
        </div>
    {% endfor %}
</div>
