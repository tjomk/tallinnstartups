<div class="flex items-center gap-4 bg-slate-50 px-4 min-h-[72px] py-2">
    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-14"
         style='background-image: url("{{ job.company_logo|default:"https://via.placeholder.com/56x56?text=Co" }}");'>
    </div>
    <div class="flex flex-col justify-center">
        <p class="text-[#0d141c] text-base font-medium leading-normal line-clamp-1">
            {% if job_url %}
                <a href="{{ job_url }}" class="hover:underline">{{ job.title }}</a>
            {% else %}
                {{ job.title }}
            {% endif %}
        </p>
        <p class="text-[#49739c] text-sm font-normal leading-normal line-clamp-2">
            {% if company_url %}
                <a href="{{ company_url }}" class="hover:underline">{{ job.company_name }}</a>
            {% else %}
                {{ job.company_name }}
            {% endif %}
        </p>
        {% if job.location %}
            <p class="text-[#49739c] text-xs font-normal leading-normal">{{ job.location }}</p>
        {% endif %}
        {% if job.salary_range %}
            <p class="text-[#0d141c] text-xs font-medium leading-normal">{{ job.salary_range }}</p>
        {% endif %}
    </div>
</div>
