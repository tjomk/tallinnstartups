{% if job.slug %}
    <a href="{% url 'job_detail' slug=job.slug %}" class="block mb-2.5">
        <div class="flex items-center gap-4 bg-slate-100 border border-slate-200 rounded-sm px-4 min-h-[72px] py-2 cursor-pointer hover:bg-transparent transition-colors">
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-14"
                 style='background-image: url("{{ job.company_logo|default:"https://via.placeholder.com/56x56?text=Co" }}");'>
            </div>
            <div class="flex flex-col justify-center">
                <p class="text-[#0d141c] text-[18px] font-medium leading-normal line-clamp-1">
                    {{ job.title }}
                </p>
                <p class="text-[#49719c] text-[15px] font-normal leading-normal line-clamp-2 mt-1">
                    {{ job.company_name }}
                </p>
            </div>
        </div>
    </a>
{% else %}
    <div class="flex items-center gap-4 bg-slate-100 border border-slate-200 rounded-sm px-4 min-h-[72px] py-2 mb-2.5 hover:bg-transparent transition-colors">
        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-14"
             style='background-image: url("{{ job.company_logo|default:"https://via.placeholder.com/56x56?text=Co" }}");'>
        </div>
        <div class="flex flex-col justify-center">
            <p class="text-[#0d141c] text-[18px] font-medium leading-normal line-clamp-1">
                {{ job.title }}
            </p>
            <p class="text-[#49739c] text-[15px] font-normal leading-normal line-clamp-2">
                {{ job.company_name }}
            </p>
        </div>
    </div>
{% endif %}
