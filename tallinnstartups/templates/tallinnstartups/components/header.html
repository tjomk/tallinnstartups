<header class="site-header">
    <div class="container header-inner">
        <div class="nav-group">
            <a href="{% url 'home' %}" class="site-logo flex items-center gap-2">
                <div class="size-6">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"
                            fill="currentColor"
                        ></path>
                    </svg>
                </div>
                <span class="text-lg font-bold leading-tight tracking-[-0.015em] hidden sm:block">Estonian Startup Jobs</span>
            </a>
            
            <!-- Desktop Navigation -->
            <nav class="main-nav hidden md:flex items-center gap-8">
                <a class="nav-link" href="{% url 'jobs' %}">Jobs</a>
                <a class="nav-link" href="{% url 'companies' %}">Companies</a>
                <a class="nav-link" href="{% url 'blog:article_list' %}">Guides</a>
                <a class="nav-link" href="{% url 'post_cofounder' %}">Co-founder matching</a>
            </nav>
        </div>
        
        <div class="header-actions">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" aria-label="Toggle theme">
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
                <svg id="theme-toggle-dark-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>

            <!-- Desktop Post Job Button -->
            <a href="{% url 'post_job' %}" class="btn-primary hidden sm:flex items-center justify-center px-4 py-2 text-sm font-medium">
                <span class="truncate">Post a Job</span>
            </a>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-button" class="md:hidden p-2" aria-label="Open menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Mobile Navigation Menu -->
    <div id="mobile-menu" class="hidden absolute top-full left-0 right-0 bg-[var(--bg-card)] border-b shadow-lg md:hidden" style="border-bottom-color: var(--border-color);">
        <nav class="flex flex-col px-4 py-2">
            <a class="nav-link py-3 border-b" style="border-bottom-color: var(--border-color);" href="{% url 'jobs' %}">Jobs</a>
            <a class="nav-link py-3 border-b" style="border-bottom-color: var(--border-color);" href="{% url 'companies' %}">Companies</a>
            <a class="nav-link py-3 border-b" style="border-bottom-color: var(--border-color);" href="{% url 'blog:article_list' %}">Guides</a>
            <a class="nav-link py-3" href="{% url 'post_cofounder' %}">Co-founder matching</a>
        </nav>
    </div>
</header>
