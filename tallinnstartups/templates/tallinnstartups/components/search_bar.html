<form method="GET" action="{% url 'home' %}" class="flex flex-col min-w-40 {% if large %}h-12 w-full{% else %}!h-10 max-w-64{% endif %}">
    <div class="flex w-full flex-1 items-stretch rounded-sm h-full">
        <div class="theme-secondary-text flex border-none items-center justify-center pl-4 rounded-l-sm border-r-0" style="background-color: var(--bg-light);"
             data-icon="MagnifyingGlass"
             data-size="24px"
             data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
            </svg>
        </div>
        <input
            placeholder="{{ placeholder|default:'Search' }}"
            name="q"
            type="text"
            class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-sm rounded-l-none border-l-0 pl-2 h-full border-none focus:outline-0 focus:ring-0 focus:border-none text-base font-normal leading-normal placeholder:text-[var(--text-secondary)]" style="background-color: var(--bg-light); color: var(--text-primary);"
            value="{{ request.GET.q|default:'' }}"
            onkeypress="if(event.key==='Enter'){this.form.submit();}"
        />
    </div>
</form>
