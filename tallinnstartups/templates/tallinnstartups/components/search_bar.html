<form method="GET" action="{% url 'home' %}" class="theme-input-wrapper {% if large %}w-full{% else %}max-w-md{% endif %}">
    <span class="search-icon">🔍</span>
    <input
        placeholder="{{ placeholder|default:'Search by title, company, or keyword...' }}"
        name="q"
        type="text"
        class="theme-input search-input-field"
        style="padding-left: 50px;"
        value="{{ request.GET.q|default:'' }}"
        onkeypress="if(event.key==='Enter'){this.form.submit();}"
    />
    <button type="submit" class="theme-button-primary" style="margin-left: 8px; height: auto;">Search</button>
</form>
