<form method="GET" action="{% url 'home' %}" class="relative w-full">
    <div class="relative flex items-center text-gray-400 focus-within:text-gray-600">
        <span class="absolute left-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
        </span>
        <input
            placeholder="{{ placeholder|default:'Search by title, company, or keyword...' }}"
            name="q"
            type="search"
            class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            value="{{ request.GET.q|default:'' }}"
        />
        <button type="submit" class="absolute right-2.5 top-1/2 -translate-y-1/2 btn-primary flex items-center justify-center px-4 py-2 text-sm font-medium">
            Search
        </button>
    </div>
</form>
